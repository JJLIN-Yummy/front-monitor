server:
  port: 8888

spring:
  #配置数据库信息
  datasource:
    type: com.zaxxer.hikari.HikariDataSource #连接池
    driver-class-name: com.mysql.cj.jdbc.Driver #驱动
    url: jdbc:mysql://127.0.0.1:3306/monitor_db?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Root@123456

  #配置redis信息
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: Redis@123456
      # username: default  没开ACL，注释掉，不要写
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 5
          max-idle: 4
          min-idle: 1
          max-wait: 1000ms

#mybatis配置信息
mybatis:
  mapper-locations: classpath:/mapper/*/*.xml
  config-location: classpath:/mybatis-config.xml
  map-underscore-to-camel-case: true



jwt:
  auth:
    noAuthUrls:
      - /api/login
      - /api/signup
      - /api/health
      - /doc.html/**
      - /webjars/**
      - /v3/**




